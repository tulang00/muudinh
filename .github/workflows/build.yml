name: Đăng web và build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  web:
    name: Đăng bản web (cài lên iPhone / Android)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Giải nén bộ file app (file zip mới nhất trong kho)
        run: unzip -o -q "$(ls MuuDinhThienHa_App_*.zip | sort -V | tail -1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: Build file APK cho Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giải nén bộ file app (file zip mới nhất trong kho)
        run: unzip -o -q "$(ls MuuDinhThienHa_App_*.zip | sort -V | tail -1)"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cài Capacitor
        run: npm install
      - name: Tạo project Android
        run: npx cap add android
      - name: Gắn icon, màn hình chờ, khóa ký cố định
        run: |
          cp -r android-res/* android/app/src/main/res/
          sed -i 's/#FFFFFF/#A8261B/' android/app/src/main/res/values/ic_launcher_background.xml
          mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Đặt tên file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MuuDinhThienHa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MuuDinhThienHa-apk
          path: MuuDinhThienHa.apk
      - name: Đưa APK lên mục Releases để tải thẳng trên điện thoại
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest -y --cleanup-tag || true
          gh release create app-latest MuuDinhThienHa.apk --title "Mưu Định Thiên Hạ – APK mới nhất" --notes "Bản build tự động từ commit ${{ github.sha }}."
