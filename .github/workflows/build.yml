name: Đăng web và build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  web:
    name: Đăng bản web (cài lên iPhone / Android)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Giải nén bộ file app (file zip mới nhất trong kho)
        run: unzip -o -q "$(ls MuuDinhThienHa_App_*.zip | sort -V | tail -1)"
      - name: Cập nhật service worker (trang luôn lấy bản mới khi có mạng)
        run: |
          python3 - <<'PY'
          import re,json
          s=open('site/sw.js').read()
          if 'cache:"reload"' not in s:
              cache=re.search(r'const CACHE="([^"]+)"',s).group(1)+'-r2'
              files=re.search(r'const FILES=(\[.*?\]);',s,re.S).group(1)
              tpl="// Service worker: l\u01b0u to\u00e0n b\u1ed9 app \u0111\u1ec3 d\u00f9ng offline.\n// Trang ch\u00ednh: \u01b0u ti\u00ean b\u1ea3n m\u1edbi tr\u00ean m\u1ea1ng, m\u1ea5t m\u1ea1ng m\u1edbi d\u00f9ng b\u1ea3n \u0111\u00e3 l\u01b0u. File n\u1eb7ng (b\u1ed9 \u0111\u1ecdc ch\u1eef, font): d\u00f9ng b\u1ea3n \u0111\u00e3 l\u01b0u.\nconst CACHE=\"__CACHE__\";\nconst FILES=__FILES__;\nself.addEventListener(\"install\",e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(FILES.map(u=>new Request(u,{cache:\"reload\"})))).then(()=>self.skipWaiting()));});\nself.addEventListener(\"activate\",e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});\nself.addEventListener(\"fetch\",e=>{\n  if(e.request.method!==\"GET\")return;\n  const u=new URL(e.request.url);if(u.origin!==location.origin)return;\n  const page=e.request.mode===\"navigate\"||/\\/(index\\.html)?$/.test(u.pathname);\n  if(page){e.respondWith(fetch(e.request,{cache:\"no-store\"}).then(r=>{if(r.ok){const c=r.clone();caches.open(CACHE).then(x=>x.put(\"./\",c));}return r;})\n    .catch(()=>caches.match(\"./\").then(r=>r||caches.match(\"index.html\"))));return;}\n  e.respondWith(caches.match(e.request,{ignoreSearch:true}).then(r=>r||fetch(e.request)));\n});\n"
              open('site/sw.js','w').write(tpl.replace('__CACHE__',cache).replace('__FILES__',files))
              print('sw.js updated',cache)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: Build file APK cho Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giải nén bộ file app (file zip mới nhất trong kho)
        run: unzip -o -q "$(ls MuuDinhThienHa_App_*.zip | sort -V | tail -1)"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cài Capacitor
        run: npm install
      - name: Tạo project Android
        run: npx cap add android
      - name: Gắn icon, màn hình chờ, khóa ký cố định
        run: |
          cp -r android-res/* android/app/src/main/res/
          sed -i 's/#FFFFFF/#A8261B/' android/app/src/main/res/values/ic_launcher_background.xml
          mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Đặt tên file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MuuDinhThienHa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MuuDinhThienHa-apk
          path: MuuDinhThienHa.apk
      - name: Đưa APK lên mục Releases để tải thẳng trên điện thoại
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest -y --cleanup-tag || true
          gh release create app-latest MuuDinhThienHa.apk --title "Mưu Định Thiên Hạ – APK mới nhất" --notes "Bản build tự động từ commit ${{ github.sha }}."
